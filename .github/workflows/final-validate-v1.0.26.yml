name: Publish and verify v1.0.26 release

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write

concurrency:
  group: publish-and-verify-v1.0.26
  cancel-in-progress: false

jobs:
  publish-and-verify:
    if: github.head_ref == 'ops/release-v1.0.26-validate'
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: 1.0.26
      EXPECTED_SOURCE_SHA: 1fb673c59ea72a9297eda9d2553a1a40b7fd32e7
    steps:
      - name: Checkout release source and verification scripts
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Dispatch formal three-platform release
        id: release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $startedAt = [DateTimeOffset]::UtcNow.AddSeconds(-15)

          gh workflow run release.yml --ref main -f version=$env:RELEASE_VERSION -f dry_run=false
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to dispatch the formal release workflow.'
          }

          $run = $null
          for ($attempt = 1; $attempt -le 60 -and -not $run; $attempt++) {
            Start-Sleep -Seconds 5
            $runs = gh run list `
              --workflow release.yml `
              --event workflow_dispatch `
              --branch main `
              --limit 30 `
              --json databaseId,headSha,createdAt,status,conclusion,url | ConvertFrom-Json
            $run = $runs |
              Where-Object {
                $_.headSha -eq $env:EXPECTED_SOURCE_SHA -and
                ([DateTimeOffset]$_.createdAt) -ge $startedAt
              } |
              Sort-Object { [DateTimeOffset]$_.createdAt } -Descending |
              Select-Object -First 1
          }
          if (-not $run) {
            throw 'Could not locate the newly dispatched formal release run.'
          }

          $runId = [string]$run.databaseId
          "run_id=$runId" >> $env:GITHUB_OUTPUT
          Write-Host "Monitoring formal release run $runId ($($run.url))"

          for ($attempt = 1; $attempt -le 720; $attempt++) {
            $state = gh run view $runId --json status,conclusion,url | ConvertFrom-Json
            Write-Host "Formal release: status=$($state.status), conclusion=$($state.conclusion)"
            if ($state.status -eq 'completed') {
              if ($state.conclusion -ne 'success') {
                gh run view $runId --log-failed
                throw "Formal release failed with conclusion: $($state.conclusion)"
              }
              exit 0
            }
            Start-Sleep -Seconds 10
          }
          throw 'Formal release did not finish before the publication timeout.'

      - name: Verify published release metadata and exact asset inventory
        id: metadata
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:RELEASE_VERSION"

          git fetch --tags --force
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to fetch the published tag.'
          }
          $tagSha = (git rev-list -n 1 $tag).Trim()
          if ($tagSha -ne $env:EXPECTED_SOURCE_SHA) {
            throw "Published tag points to $tagSha instead of $env:EXPECTED_SOURCE_SHA"
          }

          $release = gh release view $tag `
            --repo $env:GITHUB_REPOSITORY `
            --json tagName,name,isDraft,isPrerelease,publishedAt,url,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw 'Published release could not be read.'
          }
          if ($release.tagName -ne $tag) {
            throw "Release tag mismatch: $($release.tagName)"
          }
          if ($release.isDraft -or $release.isPrerelease) {
            throw 'Release is still a draft or prerelease.'
          }

          $primary = @(
            "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-x64.exe",
            "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-Portable.zip",
            "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-Setup.exe",
            "CC-Desktop-Switch-v$env:RELEASE_VERSION-macOS-arm64.pkg",
            "CC-Desktop-Switch-v$env:RELEASE_VERSION-macOS-arm64.dmg",
            "CC-Desktop-Switch-v$env:RELEASE_VERSION-macOS-x64.pkg",
            "CC-Desktop-Switch-v$env:RELEASE_VERSION-macOS-x64.dmg"
          )
          $required = @(
            $primary +
            @($primary | ForEach-Object { "$($_).sha256" }) +
            @($primary | ForEach-Object { "$($_).sig" }) +
            @(
              'latest.json',
              'latest.json.sha256',
              'latest.json.sig',
              'CC-Desktop-Switch-release-public.pem'
            )
          )
          $assetNames = @($release.assets | ForEach-Object name)
          foreach ($name in $required) {
            if ($assetNames -notcontains $name) {
              throw "Published release asset missing: $name"
            }
            $asset = $release.assets | Where-Object name -eq $name | Select-Object -First 1
            if ([long]$asset.size -le 0) {
              throw "Published release asset is empty: $name"
            }
          }

          $latestTag = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0 -or $latestTag.Trim() -ne $tag) {
            throw "v$env:RELEASE_VERSION is not the repository's latest release."
          }

          "release_url=$($release.url)" >> $env:GITHUB_OUTPUT
          Write-Host "Published release: $($release.url)"
          Write-Host "Published at: $($release.publishedAt)"
          Write-Host "Asset count: $($release.assets.Count)"

      - name: Download and cryptographically verify published Windows artifacts
        id: published
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:RELEASE_VERSION"
          New-Item -ItemType Directory -Force published-download | Out-Null
          gh release download $tag `
            --repo $env:GITHUB_REPOSITORY `
            --dir published-download `
            --pattern "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-*" `
            --pattern 'latest.json*' `
            --pattern 'CC-Desktop-Switch-release-public.pem'
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to download the published Windows verification set.'
          }

          $root = (Resolve-Path published-download).Path
          "root=$root" >> $env:GITHUB_OUTPUT
          $publicKey = Join-Path $root 'CC-Desktop-Switch-release-public.pem'
          $files = @(
            "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-x64.exe",
            "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-Portable.zip",
            "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-Setup.exe",
            'latest.json'
          )
          foreach ($name in $files) {
            $file = Join-Path $root $name
            $shaFile = "$file.sha256"
            $sigFile = "$file.sig"
            foreach ($required in @($file, $shaFile, $sigFile, $publicKey)) {
              if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
                throw "Published verification file missing: $required"
              }
            }
            $expectedHash = ((Get-Content -LiteralPath $shaFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
            $actualHash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expectedHash -ne $actualHash) {
              throw "Published SHA256 mismatch for $name"
            }
            powershell -NoProfile -ExecutionPolicy Bypass `
              -File scripts\Test-ReleaseSignature.ps1 `
              -File $file `
              -PublicKey $publicKey
            if ($LASTEXITCODE -ne 0) {
              throw "Published signature verification failed for $name"
            }
          }

          $manifest = Get-Content -LiteralPath (Join-Path $root 'latest.json') -Raw -Encoding utf8 | ConvertFrom-Json
          if ([string]$manifest.version -ne $env:RELEASE_VERSION) {
            throw "Published latest.json version mismatch: $($manifest.version)"
          }
          Write-Host 'PUBLISHED_SIGNATURES_AND_HASHES_OK'

      - name: Smoke test downloaded published one-file and portable builds
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "${{ steps.published.outputs.root }}"

          function Stop-Tree([int]$ProcessId) {
            cmd /c "taskkill /PID $ProcessId /T /F" | Out-Null
          }

          function Wait-Ready([int]$Port, [System.Diagnostics.Process]$Process, [string]$Label) {
            for ($attempt = 1; $attempt -le 90; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$Port/api/ready" -TimeoutSec 1
                if ($response.StatusCode -eq 200) {
                  Write-Host "${Label} reached /api/ready on port $Port"
                  return
                }
              } catch {
                # Continue while the packaged runtime starts.
              }
              $Process.Refresh()
              if ($Process.HasExited) {
                $crash = Join-Path $env:CCDS_CONFIG_DIR 'ccds-crash.log'
                if (Test-Path -LiteralPath $crash) {
                  Get-Content -LiteralPath $crash -Raw
                }
                throw "${Label} exited before readiness with code $($Process.ExitCode)."
              }
            }
            throw "${Label} did not reach /api/ready within 90 seconds."
          }

          function Probe([string]$Executable, [int]$Port, [string]$Label) {
            $oldConfig = $env:CCDS_CONFIG_DIR
            $env:CCDS_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "published-${Label}-config"
            New-Item -ItemType Directory -Force -Path $env:CCDS_CONFIG_DIR | Out-Null
            $process = Start-Process -FilePath $Executable -ArgumentList "--server-only --port $Port" -PassThru
            try {
              Wait-Ready $Port $process $Label
            } finally {
              $process.Refresh()
              if (-not $process.HasExited) { Stop-Tree $process.Id }
              $env:CCDS_CONFIG_DIR = $oldConfig
            }
          }

          Probe (Join-Path $root "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-x64.exe") 19102 'published-onefile'

          $portableDir = Join-Path $env:RUNNER_TEMP 'published-portable'
          Expand-Archive `
            -LiteralPath (Join-Path $root "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-Portable.zip") `
            -DestinationPath $portableDir `
            -Force
          $portableExe = Get-ChildItem -LiteralPath $portableDir -Recurse -File -Filter 'CC-Desktop-Switch.exe' |
            Select-Object -First 1
          if (-not $portableExe) {
            throw 'Published portable ZIP does not contain CC-Desktop-Switch.exe.'
          }
          Probe $portableExe.FullName 19103 'published-portable'

      - name: Verify downloaded published Setup install, upgrade, launch, and uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "${{ steps.published.outputs.root }}"

          function Stop-Tree([int]$ProcessId) {
            cmd /c "taskkill /PID $ProcessId /T /F" | Out-Null
          }

          function Wait-Ready([int]$Port, [System.Diagnostics.Process]$Process) {
            for ($attempt = 1; $attempt -le 90; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$Port/api/ready" -TimeoutSec 1
                if ($response.StatusCode -eq 200) {
                  Write-Host "Published installed executable reached /api/ready on port $Port"
                  return
                }
              } catch {
                # Continue while the installed runtime starts.
              }
              $Process.Refresh()
              if ($Process.HasExited) {
                throw "Published installed executable exited with code $($Process.ExitCode)."
              }
            }
            throw 'Published installed executable did not reach /api/ready.'
          }

          function Find-UninstallKey([string[]]$Candidates) {
            return $Candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }

          function Assert-RegistryValue([string]$Path, [string]$Name, [object]$Expected) {
            $actual = (Get-ItemProperty -LiteralPath $Path -Name $Name -ErrorAction Stop).$Name
            if ($actual -ne $Expected) {
              throw "Registry value mismatch for ${Name}: expected=$Expected actual=$actual"
            }
          }

          $setup = Join-Path $root "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-Setup.exe"
          $uninstallKeyCandidates = @(
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CC Desktop Switch',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\CC Desktop Switch'
          )
          $policyKey = 'HKCU:\Software\Policies\Claude'
          Remove-Item -LiteralPath $policyKey -Recurse -Force -ErrorAction SilentlyContinue

          $install = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Published Setup install failed with code $($install.ExitCode)."
          }
          $uninstallKey = Find-UninstallKey $uninstallKeyCandidates
          if (-not $uninstallKey) {
            throw 'Published Setup did not create uninstall metadata.'
          }
          Assert-RegistryValue $uninstallKey 'DisplayVersion' $env:RELEASE_VERSION
          $state = Get-ItemProperty -LiteralPath $uninstallKey
          $installDir = [string]$state.InstallLocation
          $installedExe = Join-Path $installDir 'CC-Desktop-Switch.exe'

          New-Item -ItemType Directory -Force -Path $policyKey | Out-Null
          foreach ($entry in ([ordered]@{
            inferenceProvider = 'gateway'
            inferenceGatewayBaseUrl = 'http://127.0.0.1:18080'
            inferenceGatewayApiKey = 'published-smoke-secret'
            inferenceGatewayAuthScheme = 'bearer'
            inferenceGatewayHeaders = '[]'
            inferenceModels = '[]'
            coworkEgressAllowedHosts = '["*"]'
            ccds_managed = 'true'
            unrelated_policy_sentinel = 'keep-me'
          }).GetEnumerator()) {
            New-ItemProperty -LiteralPath $policyKey -Name $entry.Key -Value $entry.Value -PropertyType String -Force | Out-Null
          }
          New-ItemProperty -LiteralPath $policyKey -Name 'isClaudeCodeForDesktopEnabled' -Value 1 -PropertyType DWord -Force | Out-Null

          $upgrade = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) {
            throw "Published Setup in-place upgrade failed with code $($upgrade.ExitCode)."
          }
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            $upgradedKey = Find-UninstallKey $uninstallKeyCandidates
            if ($upgradedKey -and (Test-Path -LiteralPath $installedExe)) { break }
            Start-Sleep -Seconds 1
          }
          $upgradedKey = Find-UninstallKey $uninstallKeyCandidates
          if (-not $upgradedKey) {
            throw 'Published Setup in-place upgrade failed to recreate uninstall metadata.'
          }
          Assert-RegistryValue $upgradedKey 'DisplayVersion' $env:RELEASE_VERSION
          foreach ($name in @(
            'inferenceProvider',
            'inferenceGatewayBaseUrl',
            'inferenceGatewayApiKey',
            'inferenceGatewayAuthScheme',
            'inferenceGatewayHeaders',
            'inferenceModels',
            'isClaudeCodeForDesktopEnabled',
            'coworkEgressAllowedHosts',
            'ccds_managed',
            'unrelated_policy_sentinel'
          )) {
            if (-not (Get-ItemProperty -LiteralPath $policyKey -Name $name -ErrorAction SilentlyContinue)) {
              throw "Published in-place upgrade removed policy value: $name"
            }
          }

          $env:CCDS_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'published-installed-config'
          New-Item -ItemType Directory -Force -Path $env:CCDS_CONFIG_DIR | Out-Null
          $app = Start-Process -FilePath $installedExe -ArgumentList '--server-only --port 19104' -PassThru
          try {
            Wait-Ready 19104 $app
          } finally {
            $app.Refresh()
            if (-not $app.HasExited) { Stop-Tree $app.Id }
          }

          $uninstaller = ([string](Get-ItemProperty -LiteralPath $upgradedKey).UninstallString).Trim('"')
          $remove = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($remove.ExitCode -ne 0) {
            throw "Published Setup uninstall failed with code $($remove.ExitCode)."
          }
          for ($attempt = 1; $attempt -le 45; $attempt++) {
            if (-not (Test-Path -LiteralPath $installedExe) -and -not (Find-UninstallKey $uninstallKeyCandidates)) { break }
            Start-Sleep -Seconds 1
          }
          if (Test-Path -LiteralPath $installedExe) {
            throw 'Published installed executable remained after uninstall.'
          }
          if (Find-UninstallKey $uninstallKeyCandidates) {
            throw 'Published uninstall metadata remained after uninstall.'
          }
          foreach ($managedName in @(
            'inferenceProvider',
            'inferenceGatewayBaseUrl',
            'inferenceGatewayApiKey',
            'inferenceGatewayAuthScheme',
            'inferenceGatewayHeaders',
            'inferenceModels',
            'isClaudeCodeForDesktopEnabled',
            'coworkEgressAllowedHosts',
            'ccds_managed'
          )) {
            if (Get-ItemProperty -LiteralPath $policyKey -Name $managedName -ErrorAction SilentlyContinue) {
              throw "Published uninstall left CCDS-managed policy value: $managedName"
            }
          }
          Assert-RegistryValue $policyKey 'unrelated_policy_sentinel' 'keep-me'
          Remove-Item -LiteralPath $policyKey -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host 'PUBLISHED_WINDOWS_INSTALL_LIFECYCLE_OK'

      - name: Publication summary
        shell: powershell
        run: |
          Write-Host 'V1_0_26_RELEASE_PUBLISHED_AND_VERIFIED'
          Write-Host "Formal workflow run: ${{ steps.release.outputs.run_id }}"
          Write-Host "Release URL: ${{ steps.metadata.outputs.release_url }}"
          Write-Host "Source SHA: $env:EXPECTED_SOURCE_SHA"
