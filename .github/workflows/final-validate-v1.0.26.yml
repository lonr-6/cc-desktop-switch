name: Final validate v1.0.26 release

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write

concurrency:
  group: final-validate-v1.0.26
  cancel-in-progress: false

jobs:
  release-dry-run-and-product-smoke:
    if: github.head_ref == 'ops/release-v1.0.26-validate'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: 1.0.26
      EXPECTED_SOURCE_SHA: 1fb673c59ea72a9297eda9d2553a1a40b7fd32e7
    steps:
      - name: Checkout validation source
        uses: actions/checkout@v6

      - name: Dispatch repaired three-platform release dry run
        id: release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $startedAt = [DateTimeOffset]::UtcNow.AddSeconds(-15)

          gh workflow run release.yml --ref main -f version=$env:RELEASE_VERSION -f dry_run=true
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to dispatch release.yml dry run.'
          }

          $run = $null
          for ($attempt = 1; $attempt -le 60 -and -not $run; $attempt++) {
            Start-Sleep -Seconds 5
            $runs = gh run list `
              --workflow release.yml `
              --event workflow_dispatch `
              --branch main `
              --limit 30 `
              --json databaseId,headSha,createdAt,status,conclusion,url | ConvertFrom-Json
            $run = $runs |
              Where-Object {
                $_.headSha -eq $env:EXPECTED_SOURCE_SHA -and
                ([DateTimeOffset]$_.createdAt) -ge $startedAt
              } |
              Sort-Object { [DateTimeOffset]$_.createdAt } -Descending |
              Select-Object -First 1
          }
          if (-not $run) {
            throw 'Could not locate the newly dispatched release dry run.'
          }

          $runId = [string]$run.databaseId
          "run_id=$runId" >> $env:GITHUB_OUTPUT
          Write-Host "Monitoring repaired release dry run $runId ($($run.url))"

          for ($attempt = 1; $attempt -le 540; $attempt++) {
            $state = gh run view $runId --json status,conclusion,url | ConvertFrom-Json
            Write-Host "Release dry run: status=$($state.status), conclusion=$($state.conclusion)"
            if ($state.status -eq 'completed') {
              if ($state.conclusion -ne 'success') {
                gh run view $runId --log-failed
                throw "Release dry run failed with conclusion: $($state.conclusion)"
              }
              exit 0
            }
            Start-Sleep -Seconds 10
          }
          throw 'Release dry run did not finish before the validation timeout.'

      - name: Download complete signed release staging
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release-download | Out-Null
          gh run download "${{ steps.release.outputs.run_id }}" `
            --name release-dry-run-complete `
            --dir release-download
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to download release-dry-run-complete.'
          }

      - name: Verify exact artifact set, manifest, hashes, and signatures
        id: artifacts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $latest = Get-ChildItem -LiteralPath release-download -Recurse -File -Filter latest.json |
            Select-Object -First 1
          if (-not $latest) {
            throw 'latest.json was not found in the downloaded release artifact.'
          }
          $root = $latest.Directory.FullName
          "root=$root" >> $env:GITHUB_OUTPUT

          $assetNames = @(
            "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-x64.exe",
            "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-Portable.zip",
            "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-Setup.exe",
            "CC-Desktop-Switch-v$env:RELEASE_VERSION-macOS-arm64.pkg",
            "CC-Desktop-Switch-v$env:RELEASE_VERSION-macOS-arm64.dmg",
            "CC-Desktop-Switch-v$env:RELEASE_VERSION-macOS-x64.pkg",
            "CC-Desktop-Switch-v$env:RELEASE_VERSION-macOS-x64.dmg"
          )
          $primaryNames = Get-ChildItem -LiteralPath $root -File |
            Where-Object {
              $_.Name -like "CC-Desktop-Switch-v$env:RELEASE_VERSION-*" -and
              $_.Name -notlike '*.sha256' -and
              $_.Name -notlike '*.sig'
            } |
            ForEach-Object Name |
            Sort-Object
          $expectedNames = $assetNames | Sort-Object
          if (($primaryNames -join "`n") -ne ($expectedNames -join "`n")) {
            throw "Primary release asset set mismatch.`nExpected:`n$($expectedNames -join "`n")`nActual:`n$($primaryNames -join "`n")"
          }

          $requiredNames = @(
            $assetNames +
            @(
              'latest.json',
              'latest.json.sha256',
              'latest.json.sig',
              'CC-Desktop-Switch-release-public.pem'
            )
          )
          foreach ($name in $requiredNames) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $name) -PathType Leaf)) {
              throw "Required release file missing: $name"
            }
          }

          $manifest = Get-Content -LiteralPath $latest.FullName -Raw -Encoding utf8 | ConvertFrom-Json
          if ([string]$manifest.version -ne $env:RELEASE_VERSION) {
            throw "latest.json version mismatch: $($manifest.version)"
          }
          $platforms = @($manifest.platforms.PSObject.Properties.Name)
          foreach ($platform in @('windows-x64', 'macos-arm64', 'macos-x64')) {
            if ($platforms -notcontains $platform) {
              throw "latest.json platform missing: $platform"
            }
          }

          $publicKey = Join-Path $root 'CC-Desktop-Switch-release-public.pem'
          foreach ($name in @($assetNames + @('latest.json'))) {
            $file = Join-Path $root $name
            $shaFile = "$file.sha256"
            $sigFile = "$file.sig"
            if (-not (Test-Path -LiteralPath $shaFile)) {
              throw "SHA256 file missing for $name"
            }
            if (-not (Test-Path -LiteralPath $sigFile)) {
              throw "Signature file missing for $name"
            }
            $expectedHash = ((Get-Content -LiteralPath $shaFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
            $actualHash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expectedHash -ne $actualHash) {
              throw "SHA256 mismatch for $name"
            }
            powershell -NoProfile -ExecutionPolicy Bypass `
              -File scripts\Test-ReleaseSignature.ps1 `
              -File $file `
              -PublicKey $publicKey
            if ($LASTEXITCODE -ne 0) {
              throw "Signature verification failed for $name"
            }
          }

          Get-ChildItem -LiteralPath $root -File | Sort-Object Name |
            Select-Object Name, Length | Format-Table -AutoSize

      - name: Smoke test one-file and portable Windows builds
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "${{ steps.artifacts.outputs.root }}"

          function Stop-Tree([int]$ProcessId) {
            cmd /c "taskkill /PID $ProcessId /T /F" | Out-Null
          }

          function Wait-Ready([int]$Port, [System.Diagnostics.Process]$Process, [string]$Label) {
            for ($attempt = 1; $attempt -le 90; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$Port/api/ready" -TimeoutSec 1
                if ($response.StatusCode -eq 200) {
                  Write-Host "${Label} reached /api/ready on port $Port"
                  return
                }
              } catch {
                # Continue while PyInstaller starts or extracts.
              }
              $Process.Refresh()
              if ($Process.HasExited) {
                $crash = Join-Path $env:CCDS_CONFIG_DIR 'ccds-crash.log'
                if (Test-Path -LiteralPath $crash) {
                  Get-Content -LiteralPath $crash -Raw
                }
                throw "${Label} exited before readiness with code $($Process.ExitCode)."
              }
            }
            throw "${Label} did not reach /api/ready within 90 seconds."
          }

          function Probe([string]$Executable, [int]$Port, [string]$Label) {
            $oldConfig = $env:CCDS_CONFIG_DIR
            $env:CCDS_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "ccds-${Label}-config"
            New-Item -ItemType Directory -Force -Path $env:CCDS_CONFIG_DIR | Out-Null
            $process = Start-Process -FilePath $Executable -ArgumentList "--server-only --port $Port" -PassThru
            try {
              Wait-Ready $Port $process $Label
            } finally {
              $process.Refresh()
              if (-not $process.HasExited) { Stop-Tree $process.Id }
              $env:CCDS_CONFIG_DIR = $oldConfig
            }
          }

          $oneFile = Join-Path $root "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-x64.exe"
          Probe $oneFile 19082 'onefile'

          $portableDir = Join-Path $env:RUNNER_TEMP 'ccds-portable-final'
          Expand-Archive `
            -LiteralPath (Join-Path $root "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-Portable.zip") `
            -DestinationPath $portableDir `
            -Force
          $portableExe = Get-ChildItem -LiteralPath $portableDir -Recurse -File -Filter 'CC-Desktop-Switch.exe' |
            Select-Object -First 1
          if (-not $portableExe) {
            throw 'Portable ZIP does not contain CC-Desktop-Switch.exe.'
          }
          Probe $portableExe.FullName 19083 'portable'

      - name: Validate Windows install, in-place upgrade, launch, and uninstall lifecycle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "${{ steps.artifacts.outputs.root }}"

          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'Windows install lifecycle requires an elevated runner.'
          }

          function Stop-Tree([int]$ProcessId) {
            cmd /c "taskkill /PID $ProcessId /T /F" | Out-Null
          }

          function Wait-Ready([int]$Port, [System.Diagnostics.Process]$Process, [string]$Label) {
            for ($attempt = 1; $attempt -le 90; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$Port/api/ready" -TimeoutSec 1
                if ($response.StatusCode -eq 200) {
                  Write-Host "${Label} reached /api/ready on port $Port"
                  return
                }
              } catch {
                # Continue while the packaged runtime starts.
              }
              $Process.Refresh()
              if ($Process.HasExited) {
                $crash = Join-Path $env:CCDS_CONFIG_DIR 'ccds-crash.log'
                if (Test-Path -LiteralPath $crash) {
                  Get-Content -LiteralPath $crash -Raw
                }
                throw "${Label} exited before readiness with code $($Process.ExitCode)."
              }
            }
            throw "${Label} did not reach /api/ready within 90 seconds."
          }

          function Assert-RegistryValue([string]$Path, [string]$Name, [object]$Expected) {
            $actual = (Get-ItemProperty -LiteralPath $Path -Name $Name -ErrorAction Stop).$Name
            if ($actual -ne $Expected) {
              throw "Registry value mismatch for ${Name}: expected=$Expected actual=$actual"
            }
          }

          function Find-UninstallKey([string[]]$Candidates) {
            return $Candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }

          $setup = Join-Path $root "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-Setup.exe"
          $uninstallKeyCandidates = @(
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CC Desktop Switch',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\CC Desktop Switch'
          )
          $policyKey = 'HKCU:\Software\Policies\Claude'
          Remove-Item -LiteralPath $policyKey -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host 'Installing v1.0.26 silently...'
          $firstInstall = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($firstInstall.ExitCode -ne 0) {
            throw "Initial silent install failed with code $($firstInstall.ExitCode)."
          }
          $uninstallKey = Find-UninstallKey $uninstallKeyCandidates
          if (-not $uninstallKey) {
            throw 'Uninstall registry entry was not created by the first install.'
          }
          Assert-RegistryValue $uninstallKey 'DisplayVersion' $env:RELEASE_VERSION
          $installedState = Get-ItemProperty -LiteralPath $uninstallKey
          $installDir = [string]$installedState.InstallLocation
          $uninstaller = ([string]$installedState.UninstallString).Trim('"')
          $installedExe = Join-Path $installDir 'CC-Desktop-Switch.exe'
          foreach ($required in @($installedExe, $uninstaller)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Installed file missing: $required"
            }
          }

          New-Item -ItemType Directory -Force -Path $policyKey | Out-Null
          $policyValues = [ordered]@{
            inferenceProvider = 'gateway'
            inferenceGatewayBaseUrl = 'http://127.0.0.1:18080'
            inferenceGatewayApiKey = 'smoke-secret'
            inferenceGatewayAuthScheme = 'bearer'
            inferenceGatewayHeaders = '[]'
            inferenceModels = '[]'
            coworkEgressAllowedHosts = '["*"]'
            ccds_managed = 'true'
            unrelated_policy_sentinel = 'keep-me'
          }
          foreach ($entry in $policyValues.GetEnumerator()) {
            New-ItemProperty -LiteralPath $policyKey -Name $entry.Key -Value $entry.Value -PropertyType String -Force | Out-Null
          }
          New-ItemProperty -LiteralPath $policyKey -Name 'isClaudeCodeForDesktopEnabled' -Value 1 -PropertyType DWord -Force | Out-Null

          Write-Host 'Running same-version silent in-place upgrade...'
          $upgrade = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) {
            throw "Silent in-place upgrade failed with code $($upgrade.ExitCode)."
          }
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            $upgradedKey = Find-UninstallKey $uninstallKeyCandidates
            if ($upgradedKey -and (Test-Path -LiteralPath $installedExe)) {
              break
            }
            Start-Sleep -Seconds 1
          }
          $upgradedKey = Find-UninstallKey $uninstallKeyCandidates
          if (-not $upgradedKey) {
            throw 'In-place upgrade failed to recreate uninstall metadata.'
          }
          Assert-RegistryValue $upgradedKey 'DisplayVersion' $env:RELEASE_VERSION
          if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf)) {
            throw 'In-place upgrade failed to restore the installed executable.'
          }
          foreach ($name in @($policyValues.Keys + @('isClaudeCodeForDesktopEnabled'))) {
            if (-not (Get-ItemProperty -LiteralPath $policyKey -Name $name -ErrorAction SilentlyContinue)) {
              throw "In-place upgrade incorrectly removed policy value: $name"
            }
          }

          $env:CCDS_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'ccds-installed-final'
          New-Item -ItemType Directory -Force -Path $env:CCDS_CONFIG_DIR | Out-Null
          $app = Start-Process -FilePath $installedExe -ArgumentList '--server-only --port 19084' -PassThru
          try {
            Wait-Ready 19084 $app 'installed executable'
          } finally {
            $app.Refresh()
            if (-not $app.HasExited) { Stop-Tree $app.Id }
          }

          $uninstaller = ([string](Get-ItemProperty -LiteralPath $upgradedKey).UninstallString).Trim('"')
          Write-Host 'Uninstalling v1.0.26 silently...'
          $remove = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($remove.ExitCode -ne 0) {
            throw "Silent uninstall failed with code $($remove.ExitCode)."
          }
          for ($attempt = 1; $attempt -le 45; $attempt++) {
            $remainingKey = Find-UninstallKey $uninstallKeyCandidates
            if (-not (Test-Path -LiteralPath $installedExe) -and -not $remainingKey) {
              break
            }
            Start-Sleep -Seconds 1
          }
          if (Test-Path -LiteralPath $installedExe) {
            throw 'Installed executable remained after uninstall.'
          }
          if (Find-UninstallKey $uninstallKeyCandidates) {
            throw 'Uninstall registry entry remained after uninstall.'
          }

          foreach ($managedName in @(
            'inferenceProvider',
            'inferenceGatewayBaseUrl',
            'inferenceGatewayApiKey',
            'inferenceGatewayAuthScheme',
            'inferenceGatewayHeaders',
            'inferenceModels',
            'isClaudeCodeForDesktopEnabled',
            'coworkEgressAllowedHosts',
            'ccds_managed'
          )) {
            if (Get-ItemProperty -LiteralPath $policyKey -Name $managedName -ErrorAction SilentlyContinue) {
              throw "Real uninstall left CCDS-managed policy value: $managedName"
            }
          }
          Assert-RegistryValue $policyKey 'unrelated_policy_sentinel' 'keep-me'
          Remove-Item -LiteralPath $policyKey -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host 'WINDOWS_INSTALL_LIFECYCLE_OK'

      - name: Final dry-run validation summary
        shell: powershell
        run: |
          Write-Host 'FINAL_DRY_RUN_VALIDATION_OK'
          Write-Host "Release workflow run: ${{ steps.release.outputs.run_id }}"
          Write-Host "Validated source SHA: $env:EXPECTED_SOURCE_SHA"
          Write-Host "Validated version: $env:RELEASE_VERSION"
