name: Apply reviewed stable maintenance patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: codex/stable-maintenance-20260818
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply the reviewed patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/maintenance-patch.yml')
          source = workflow.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          if source.count(marker) != 1:
              raise RuntimeError('Could not locate the embedded maintenance script')
          embedded = source.split(marker, 1)[1].split('\n          PY', 1)[0]
          code = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in embedded.splitlines()
          )
          exec(compile(code, str(workflow), 'exec'), {'__name__': '__main__'})

          generated_test = Path('tests/test_maintenance_regressions.py')
          lines = generated_test.read_text(encoding='utf-8').splitlines()
          for index, line in enumerate(lines):
              if 'self.assertIn("ExecWait' in line and '/UPGRADE' in line:
                  lines[index] = '        self.assertIn("/S /UPGRADE", source)'
                  break
          else:
              raise RuntimeError('Could not repair the generated NSIS assertion')
          generated_test.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git checkout -- .github/workflows/maintenance-patch.yml .github/workflows/maintenance-trigger.yml
          rm -f .github/workflows/test.yml

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and test Python
        run: |
          python -m compileall -q backend main.py tests
          python -m unittest discover -s tests -v

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/js/api.js
          node --check frontend/js/app.js
          node --check frontend/js/i18n.js

      - name: Validate NSIS installer syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          mkdir -p dist/CC-Desktop-Switch
          printf 'syntax-check' > dist/CC-Desktop-Switch/placeholder.txt
          makensis -V2 installer.nsi
          rm -rf dist CC-Desktop-Switch-Setup-1.0.25.exe

      - name: Commit reviewed changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden stable maintenance paths"
          git push origin HEAD:codex/stable-maintenance-20260818
