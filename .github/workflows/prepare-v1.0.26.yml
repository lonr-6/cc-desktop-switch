name: Prepare v1.0.26 release

on:
  push:
    branches:
      - release/v1.0.26-prep

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout release preparation branch
        uses: actions/checkout@v6
        with:
          ref: release/v1.0.26-prep
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Apply version and release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          ROOT = Path.cwd()

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              target = ROOT / path
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(
                      f"{path}: expected {expected} occurrences of {old!r}, found {count}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact("main.py", 'APP_VERSION = "1.0.25"', 'APP_VERSION = "1.0.26"')
          replace_exact(
              "backend/config.py",
              '"version": "1.0.25",',
              '"version": "1.0.26",',
          )
          replace_exact(
              "backend/main.py",
              'FastAPI(title="CC Desktop Switch Admin", version="1.0.25")',
              'FastAPI(title="CC Desktop Switch Admin", version="1.0.26")',
          )
          replace_exact(
              "backend/proxy.py",
              'FastAPI(title="CC Desktop Switch Proxy", version="1.0.25")',
              'FastAPI(title="CC Desktop Switch Proxy", version="1.0.26")',
          )
          replace_exact(
              "frontend/index.html",
              '<div class="about-row"><span data-i18n="settings.version">版本</span><strong>1.0.25</strong></div>',
              '<div class="about-row"><span data-i18n="settings.version">版本</span><strong>1.0.26</strong></div>',
          )
          replace_exact(
              "installer.nsi",
              "CC-Desktop-Switch-Setup-1.0.25.exe",
              "CC-Desktop-Switch-Setup-1.0.26.exe",
          )
          replace_exact(
              "installer.nsi",
              '!define PRODUCT_VERSION "1.0.25"',
              '!define PRODUCT_VERSION "1.0.26"',
          )
          replace_exact(
              "scripts/New-Release.ps1",
              '[string]$Version = "1.0.25"',
              '[string]$Version = "1.0.26"',
          )
          replace_exact(
              "start.bat",
              "CC Desktop Switch v1.0.25",
              "CC Desktop Switch v1.0.26",
          )
          replace_exact(
              "build.bat",
              "CC Desktop Switch v1.0.25 - 构建工具",
              "CC Desktop Switch v1.0.26 - 构建工具",
          )

          release_notes = dedent(
              """
              # CC Desktop Switch v1.0.26

              ## English

              This patch release hardens provider editing, upstream diagnostics, uninstall cleanup, and the cross-platform release gate.

              - Fixed provider model mappings with legacy aliases being restored after the user explicitly removed Opus, Sonnet, or Haiku slots.
              - Tightened DeepSeek Max compatibility detection. Authentication, URL, model, context-length, and unrelated parameter errors now keep their original upstream diagnosis instead of being mislabeled as “Max is unsupported.”
              - Fixed lowercase and canonical OpenAI-compatible preset metadata so presets are routed through the existing API-format normalizer.
              - On Windows, a normal uninstall now removes only Claude Desktop policy values marked with `ccds_managed=true`. Silent in-place upgrades preserve the active provider configuration through `/UPGRADE`.
              - Added Ubuntu, Windows, and macOS test coverage, frontend JavaScript syntax checks, and NSIS installer compilation.
              - Updated GitHub Actions to the current Node 24 action generations and documented the boundaries for Claude account features and GitHub Copilot BYOK.

              ### Upgrade notes

              No provider migration is required. After upgrading, re-apply the active provider to Claude Desktop and fully restart Claude Desktop. Users uninstalling v1.0.25 or earlier should use **Clear Desktop configuration** before removing the old version.

              ## 简体中文

              本次补丁版重点加固 provider 编辑、上游错误诊断、卸载清理和跨平台发布门禁。

              - 修复带旧别名的模型映射在用户明确删除 Opus、Sonnet 或 Haiku 槽位后又自动恢复的问题。
              - 收紧 DeepSeek Max 兼容错误判断。鉴权、URL、模型、上下文长度和其他参数错误会保留真实上游诊断，不再被误报为“模型不支持 Max”。
              - 修复小写及规范 OpenAI 兼容预设元数据的处理，统一交给现有 API 格式归一化逻辑。
              - Windows 正常卸载时只清理由 `ccds_managed=true` 标记、确由 CCDS 写入的 Claude Desktop 策略值；静默覆盖升级通过 `/UPGRADE` 保留当前 provider 配置。
              - 新增 Ubuntu、Windows、macOS 三平台测试、前端 JavaScript 语法检查和 NSIS 安装器编译。
              - GitHub Actions 升级到当前 Node 24 action 代际，并补充 Claude 账号功能和 GitHub Copilot BYOK 的产品边界说明。

              ### 升级说明

              无需迁移 provider。升级后请重新对当前 provider 执行“一键应用到 Claude 桌面版”，并完整重启 Claude Desktop。卸载 v1.0.25 及更早版本前，建议先执行“清除桌面版配置”。
              """
          ).lstrip()
          (ROOT / "docs/release-notes-v1.0.26.md").write_text(
              release_notes,
              encoding="utf-8",
          )

          changelog = ROOT / "docs/CHANGELOG.md"
          changelog_text = changelog.read_text(encoding="utf-8")
          marker = "</p>\n\n## v1.0.25"
          if changelog_text.count(marker) != 1:
              raise RuntimeError("Could not locate the v1.0.25 changelog insertion point")
          new_entry = dedent(
              """
              </p>

              ## v1.0.26

              Release notes: [docs/release-notes-v1.0.26.md](release-notes-v1.0.26.md)

              - Fixed legacy model aliases restoring explicitly removed Opus, Sonnet, and Haiku mappings.
              - Preserved real upstream errors unless a response explicitly rejects thinking/effort fields.
              - Normalized OpenAI-compatible preset metadata.
              - Cleaned only CCDS-managed Claude policy values during a real Windows uninstall while preserving upgrades.
              - Added cross-platform CI, NSIS compilation, and current Node 24 GitHub Actions.

              ## v1.0.25
              """
          ).lstrip()
          changelog.write_text(
              changelog_text.replace(marker, new_entry, 1),
              encoding="utf-8",
          )

          version_test = dedent(
              """
              import unittest
              from pathlib import Path

              import main as app_main
              from backend import config as cfg
              from backend.main import create_admin_app
              from backend.proxy import create_proxy_app


              ROOT = Path(__file__).resolve().parents[1]
              EXPECTED_VERSION = "1.0.26"


              class ReleaseVersionSyncTests(unittest.TestCase):
                  def test_runtime_and_packaging_versions_are_synchronized(self):
                      self.assertEqual(app_main.APP_VERSION, EXPECTED_VERSION)
                      self.assertEqual(cfg.DEFAULT_CONFIG["version"], EXPECTED_VERSION)
                      self.assertEqual(create_admin_app().version, EXPECTED_VERSION)
                      self.assertEqual(create_proxy_app().version, EXPECTED_VERSION)

                      checks = {
                          "frontend/index.html": f"<strong>{EXPECTED_VERSION}</strong>",
                          "installer.nsi": f'!define PRODUCT_VERSION "{EXPECTED_VERSION}"',
                          "scripts/New-Release.ps1": f'[string]$Version = "{EXPECTED_VERSION}"',
                          "start.bat": f"CC Desktop Switch v{EXPECTED_VERSION}",
                          "build.bat": f"CC Desktop Switch v{EXPECTED_VERSION} - 构建工具",
                          "docs/CHANGELOG.md": f"## v{EXPECTED_VERSION}",
                          f"docs/release-notes-v{EXPECTED_VERSION}.md": f"# CC Desktop Switch v{EXPECTED_VERSION}",
                      }
                      for relative_path, expected in checks.items():
                          text = (ROOT / relative_path).read_text(encoding="utf-8")
                          self.assertIn(expected, text, relative_path)


              if __name__ == "__main__":
                  unittest.main()
              """
          ).lstrip()
          (ROOT / "tests/test_release_version_sync.py").write_text(
              version_test,
              encoding="utf-8",
          )
          PY

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and test Python
        run: |
          python -m compileall -q backend main.py tests
          python -m unittest discover -s tests -v

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/js/api.js
          node --check frontend/js/app.js
          node --check frontend/js/i18n.js

      - name: Compile NSIS installer
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          mkdir -p dist/CC-Desktop-Switch
          printf 'syntax-check' > dist/CC-Desktop-Switch/placeholder.txt
          makensis -V2 installer.nsi
          rm -rf dist CC-Desktop-Switch-Setup-1.0.26.exe

      - name: Smoke test source admin server
        shell: bash
        run: |
          export CCDS_CONFIG_DIR="$RUNNER_TEMP/ccds-source-smoke"
          python main.py --server-only --port 19081 >"$RUNNER_TEMP/ccds-source-smoke.log" 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in {1..60}; do
            if curl -fsS "http://127.0.0.1:19081/api/ready" >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/ccds-source-smoke.log" >&2
              exit 1
            fi
            sleep 0.5
          done
          if [[ "$ready" != "1" ]]; then
            cat "$RUNNER_TEMP/ccds-source-smoke.log" >&2
            exit 1
          fi

      - name: Commit release preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            main.py \
            backend/config.py \
            backend/main.py \
            backend/proxy.py \
            frontend/index.html \
            installer.nsi \
            scripts/New-Release.ps1 \
            start.bat \
            build.bat \
            docs/CHANGELOG.md \
            docs/release-notes-v1.0.26.md \
            tests/test_release_version_sync.py
          git commit -m "chore(release): prepare v1.0.26"
          git push origin HEAD:release/v1.0.26-prep
