name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix, for example 1.1.0-rc1"
        required: true
        type: string
      confirm_publish:
        description: "Type PUBLISH_LATEST to upload and mark the GitHub Release as Latest"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build_windows:
    name: Build Windows x64
    runs-on: windows-latest
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust UI and Tauri tools
        shell: powershell
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown
          cargo install trunk --locked
          cargo install tauri-cli --version "^2" --locked

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Run Rust/Tauri release gate
        shell: powershell
        run: cargo xtask verify --all

      - name: Prepare Windows release assets
        shell: powershell
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $releaseDir = "release-staging"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $appExe = "target\release\cc-desktop-switch.exe"
          $setupSource = Get-ChildItem -LiteralPath "target\release\bundle\nsis" -File -Filter "*setup.exe" |
            Select-Object -First 1
          if (-not (Test-Path -LiteralPath $appExe)) {
            throw "Rust/Tauri app exe missing: $appExe"
          }
          if (-not $setupSource) {
            throw "Rust/Tauri NSIS setup missing under target\release\bundle\nsis"
          }

          if ($env:WINDOWS_CODESIGN_PFX_BASE64) {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Invoke-CodeSigning.ps1 `
              -Files @($appExe, $setupSource.FullName) `
              -CertificateBase64 $env:WINDOWS_CODESIGN_PFX_BASE64 `
              -CertificatePassword $env:WINDOWS_CODESIGN_PFX_PASSWORD
          }

          $portableDir = Join-Path $env:RUNNER_TEMP "ccds-portable"
          if (Test-Path -LiteralPath $portableDir) {
            Remove-Item -LiteralPath $portableDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item -LiteralPath $appExe -Destination (Join-Path $portableDir "CC-Desktop-Switch.exe") -Force
          if (Test-Path -LiteralPath "LICENSE.txt") {
            Copy-Item -LiteralPath "LICENSE.txt" -Destination (Join-Path $portableDir "LICENSE.txt") -Force
          }

          $portableZip = Join-Path $releaseDir "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-Portable.zip"
          if (Test-Path -LiteralPath $portableZip) {
            Remove-Item -LiteralPath $portableZip -Force
          }
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath $portableZip -Force

          Copy-Item -LiteralPath $appExe `
            -Destination (Join-Path $releaseDir "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-x64.exe") `
            -Force
          Copy-Item -LiteralPath $setupSource.FullName `
            -Destination (Join-Path $releaseDir "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-Setup.exe") `
            -Force

          foreach ($path in @(
            "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-x64.exe",
            "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-Portable.zip",
            "CC-Desktop-Switch-v$env:RELEASE_VERSION-Windows-Setup.exe"
          )) {
            $fullPath = Join-Path $releaseDir $path
            if (-not (Test-Path -LiteralPath $fullPath)) {
              throw "Required Windows artifact missing: $fullPath"
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: release-staging/*
          if-no-files-found: error
          retention-days: 7

  build_macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            expected_uname: arm64
          - arch: x64
            runner: macos-15-intel
            expected_uname: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner architecture
        shell: bash
        run: |
          actual="$(uname -m)"
          expected="${{ matrix.expected_uname }}"
          echo "runner=$(sw_vers -productVersion) arch=$actual expected=$expected"
          if [[ "$actual" != "$expected" ]]; then
            echo "Expected runner arch $expected, got: $actual" >&2
            exit 1
          fi

      - name: Install Rust UI and Tauri tools
        shell: bash
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown
          cargo install trunk --locked
          cargo install tauri-cli --version "^2" --locked

      - name: Run Rust/Tauri release gate
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cd ui && trunk build --release
          cd ..
          cargo tauri build

      - name: Prepare macOS release assets
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          app_path="$(find target/release/bundle -type d -name "CC Desktop Switch.app" -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "CC Desktop Switch.app was not produced" >&2
            find target/release/bundle -maxdepth 4 -print >&2 || true
            exit 1
          fi

          info_plist="$app_path/Contents/Info.plist"
          macos_dir="$app_path/Contents/MacOS"
          plutil -lint "$info_plist"
          executable_count="$(find "$macos_dir" -type f -perm -111 | wc -l | tr -d ' ')"
          if [[ "$executable_count" -lt 1 ]]; then
            echo "No executable file found under $macos_dir" >&2
            exit 1
          fi

          dmg_source="$(find target/release/bundle -type f -name "*.dmg" -print -quit)"
          if [[ -z "$dmg_source" ]]; then
            echo "No DMG was produced" >&2
            find target/release/bundle -maxdepth 4 -print >&2 || true
            exit 1
          fi
          hdiutil verify "$dmg_source"

          staging="release-staging"
          mkdir -p "$staging"
          pkg_path="$staging/CC-Desktop-Switch-v${VERSION}-macOS-${ARCH}.pkg"
          dmg_path="$staging/CC-Desktop-Switch-v${VERSION}-macOS-${ARCH}.dmg"
          pkgbuild --install-location /Applications --component "$app_path" "$pkg_path"
          pkgutil --expand "$pkg_path" "$RUNNER_TEMP/pkg-expanded"
          cp "$dmg_source" "$dmg_path"
          test -f "$pkg_path"
          test -f "$dmg_path"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-staging/*
          if-no-files-found: error
          retention-days: 7

  assemble_release:
    name: Assemble signed release staging
    runs-on: windows-latest
    needs:
      - prepare
      - build_windows
      - build_macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-staging
          merge-multiple: true

      - name: Generate manifest and signatures
        shell: powershell
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CCDS_RELEASE_PRIVATE_KEY_BASE64: ${{ secrets.CCDS_RELEASE_PRIVATE_KEY_BASE64 }}
          CCDS_RELEASE_PUBLIC_KEY_BASE64: ${{ secrets.CCDS_RELEASE_PUBLIC_KEY_BASE64 }}
          CCDS_RELEASE_PUBLIC_KEY_SHA256: "3649e9dffa2dd4929a954aa33aca5e3b74b6c9e71eb14e0bdee94df64a41b8af"
        run: |
          $notesPath = "docs\release-notes-v$env:RELEASE_VERSION.md"
          if (-not $env:CCDS_RELEASE_PRIVATE_KEY_BASE64 -or -not $env:CCDS_RELEASE_PUBLIC_KEY_BASE64) {
            throw "Release signing secrets are required: CCDS_RELEASE_PRIVATE_KEY_BASE64 and CCDS_RELEASE_PUBLIC_KEY_BASE64."
          }

          $keyDir = Join-Path $env:RUNNER_TEMP "ccds-release-signing"
          New-Item -ItemType Directory -Force -Path $keyDir | Out-Null
          $ascii = [System.Text.Encoding]::ASCII
          [System.IO.File]::WriteAllText(
            (Join-Path $keyDir "release-private-key.pem"),
            $ascii.GetString([Convert]::FromBase64String($env:CCDS_RELEASE_PRIVATE_KEY_BASE64)),
            $ascii
          )
          [System.IO.File]::WriteAllText(
            (Join-Path $keyDir "release-public-key.pem"),
            $ascii.GetString([Convert]::FromBase64String($env:CCDS_RELEASE_PUBLIC_KEY_BASE64)),
            $ascii
          )

          $args = @(
            "-NoProfile",
            "-ExecutionPolicy", "Bypass",
            "-File", "scripts\New-ReleaseManifest.ps1",
            "-Version", $env:RELEASE_VERSION,
            "-StagingDir", "release-staging",
            "-Repository", $env:GITHUB_REPOSITORY,
            "-KeyDir", $keyDir,
            "-RequireExistingKey",
            "-ExpectedPublicKeySha256", $env:CCDS_RELEASE_PUBLIC_KEY_SHA256,
            "-RequiredPlatforms", "windows-x64", "macos-arm64", "macos-x64"
          )
          if (Test-Path -LiteralPath $notesPath) {
            $args += @("-NotesFile", $notesPath)
          }

          powershell @args
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify release signatures
        shell: powershell
        run: |
          $publicKey = "release-staging\CC-Desktop-Switch-release-public.pem"
          $files = Get-ChildItem -LiteralPath "release-staging" -File |
            Where-Object {
              $_.Name -ne "CC-Desktop-Switch-release-public.pem" -and
              $_.Name -notlike "*.sha256" -and
              $_.Name -notlike "*.sig"
            }

          foreach ($file in $files) {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Test-ReleaseSignature.ps1 -File $file.FullName -PublicKey $publicKey
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Upload signed release staging
        uses: actions/upload-artifact@v4
        with:
          name: release-staging-signed
          path: release-staging/*
          if-no-files-found: error
          retention-days: 7

  publish_release:
    name: Publish GitHub Release
    runs-on: windows-latest
    needs:
      - prepare
      - assemble_release
    if: ${{ inputs.confirm_publish == 'PUBLISH_LATEST' }}
    permissions:
      contents: write
    environment:
      name: release-publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust for readiness gate
        shell: powershell
        run: rustup component add rustfmt clippy

      - name: Verify RC readiness evidence
        shell: powershell
        run: cargo xtask verify --stage rc-readiness

      - name: Download signed release staging
        uses: actions/download-artifact@v4
        with:
          name: release-staging-signed
          path: release-staging

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          function Invoke-Gh {
            gh @args
            if ($LASTEXITCODE -ne 0) {
              throw "gh $($args -join ' ') failed with exit code $LASTEXITCODE"
            }
          }

          $tag = $env:RELEASE_TAG
          $target = $env:GITHUB_SHA
          $notesPath = "docs\release-notes-v$env:RELEASE_VERSION.md"
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          if (Test-Path -LiteralPath $notesPath) {
            Copy-Item -LiteralPath $notesPath -Destination $notesFile -Force
          } else {
            Set-Content -LiteralPath $notesFile -Value "Release for CC Desktop Switch v$env:RELEASE_VERSION." -Encoding utf8
          }

          git fetch --tags
          $existingTag = git rev-parse -q --verify "refs/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0 -and $existingTag.Trim() -ne $target) {
            throw "Tag $tag points to $($existingTag.Trim()), but this workflow is publishing $target."
          }

          $isDraft = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq ".isDraft" 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($isDraft.Trim() -ne "true") {
              throw "Release $tag already exists and is not a draft."
            }
            Invoke-Gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "CC Desktop Switch $tag" --notes-file $notesFile --verify-tag
          } else {
            Invoke-Gh release create $tag --repo $env:GITHUB_REPOSITORY --draft --title "CC Desktop Switch $tag" --notes-file $notesFile --target $target
          }

          $existingAssetsText = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq ".assets[].name" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existingAssets = $existingAssetsText -split "\r?\n"
            foreach ($asset in $existingAssets) {
              if ($asset) {
                Invoke-Gh release delete-asset $tag $asset --repo $env:GITHUB_REPOSITORY --yes
              }
            }
          }

          $assets = Get-ChildItem -LiteralPath "release-staging" -File | Sort-Object Name | ForEach-Object { $_.FullName }
          if (-not $assets) {
            throw "No release assets found."
          }

          Invoke-Gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          Invoke-Gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest --verify-tag
