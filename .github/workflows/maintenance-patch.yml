name: One-shot stable maintenance patch

on:
  push:
    branches:
      - codex/stable-maintenance-20260818

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: codex/stable-maintenance-20260818
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply reviewed maintenance changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          ROOT = Path.cwd()

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one match in {path}, found {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          proxy_path = ROOT / "backend/proxy.py"
          replace_once(
              proxy_path,
              dedent('''
              def _is_max_unsupported_error(status_code: int, error_text: str) -> bool:
                  """判断上游错误是否因为不支持 max/thinking/output_config 导致。"""
                  if status_code not in (400, 422):
                      return False
                  text = (error_text or "").lower()
                  keywords = [
                      "output_config", "thinking", "effort", "max",
                      "not supported", "unsupported", "invalid parameter",
                  ]
                  return any(kw in text for kw in keywords)
              ''').lstrip(),
              dedent('''
              def _is_max_unsupported_error(status_code: int, error_text: str) -> bool:
                  """只把明确拒绝 thinking/effort 字段的 400/422 识别为 Max 不兼容。"""
                  if status_code not in (400, 422):
                      return False
                  text = (error_text or "").lower()
                  parameter_markers = (
                      "output_config",
                      "output config",
                      "reasoning_effort",
                      "reasoning effort",
                      "thinking",
                      "effort",
                  )
                  rejection_markers = (
                      "not supported",
                      "unsupported",
                      "invalid parameter",
                      "invalid value",
                      "unknown parameter",
                      "unknown field",
                      "unrecognized",
                      "not allowed",
                      "unexpected",
                      "extra inputs are not permitted",
                  )
                  return (
                      any(marker in text for marker in parameter_markers)
                      and any(marker in text for marker in rejection_markers)
                  )
              ''').lstrip(),
          )

          app_path = ROOT / "frontend/js/app.js"
          replace_once(
              app_path,
              '    setFormApiFormat(preset.apiFormat === "OpenAI" ? "openai_chat" : "anthropic");\n',
              '    setFormApiFormat(preset.apiFormat);\n',
          )

          large_test_path = ROOT / "tests/test_provider_config_and_proxy.py"
          large_test = large_test_path.read_text(encoding="utf-8")
          old_patch = 'with patch("main.ctypes.windll", self.FakeWinDll(kernel32)):'
          match_count = large_test.count(old_patch)
          if match_count != 2:
              raise RuntimeError(f"Expected two ctypes.windll patches, found {match_count}")
          large_test_path.write_text(
              large_test.replace(
                  old_patch,
                  'with patch("main.ctypes.windll", self.FakeWinDll(kernel32), create=True):',
              ),
              encoding="utf-8",
          )

          installer_path = ROOT / "installer.nsi"
          replace_once(
              installer_path,
              '!include "MUI2.nsh"\n!include "FileFunc.nsh"\n!include "LogicLib.nsh"\n\n!define MUI_ABORTWARNING\n',
              '!include "MUI2.nsh"\n!include "FileFunc.nsh"\n!include "LogicLib.nsh"\n\n!define CLAUDE_POLICY_KEY "Software\\Policies\\Claude"\nVar UninstallIsUpgrade\n\n!define MUI_ABORTWARNING\n',
          )
          replace_once(
              installer_path,
              '        ExecWait \'"$R0" /S\'\n',
              '        ExecWait \'"$R0" /S /UPGRADE\'\n',
          )
          replace_once(
              installer_path,
              'Section "Main" SEC01\n',
              dedent('''
              Function un.onInit
                  StrCpy $UninstallIsUpgrade "0"
                  ${GetParameters} $R0
                  ClearErrors
                  ${GetOptions} "$R0" "/UPGRADE" $R1
                  IfErrors done_uninit
                  StrCpy $UninstallIsUpgrade "1"
              done_uninit:
              FunctionEnd

              Function un.ClearClaudePolicy
                  ReadRegStr $0 HKCU "${CLAUDE_POLICY_KEY}" "ccds_managed"
                  StrCmp $0 "true" 0 done_clear_policy
                  DetailPrint "Removing Claude Desktop policy values managed by CC Desktop Switch..."
                  DeleteRegValue HKCU "${CLAUDE_POLICY_KEY}" "inferenceProvider"
                  DeleteRegValue HKCU "${CLAUDE_POLICY_KEY}" "inferenceGatewayBaseUrl"
                  DeleteRegValue HKCU "${CLAUDE_POLICY_KEY}" "inferenceGatewayApiKey"
                  DeleteRegValue HKCU "${CLAUDE_POLICY_KEY}" "inferenceGatewayAuthScheme"
                  DeleteRegValue HKCU "${CLAUDE_POLICY_KEY}" "inferenceGatewayHeaders"
                  DeleteRegValue HKCU "${CLAUDE_POLICY_KEY}" "inferenceModels"
                  DeleteRegValue HKCU "${CLAUDE_POLICY_KEY}" "isClaudeCodeForDesktopEnabled"
                  DeleteRegValue HKCU "${CLAUDE_POLICY_KEY}" "coworkEgressAllowedHosts"
                  DeleteRegValue HKCU "${CLAUDE_POLICY_KEY}" "ccds_managed"
                  DeleteRegKey /ifempty HKCU "${CLAUDE_POLICY_KEY}"
              done_clear_policy:
              FunctionEnd

              Section "Main" SEC01
              ''').lstrip(),
          )
          replace_once(
              installer_path,
              'Section "Uninstall"\n    Call un.CloseRunningApp\n',
              'Section "Uninstall"\n    Call un.CloseRunningApp\n    ${If} $UninstallIsUpgrade != "1"\n        Call un.ClearClaudePolicy\n    ${EndIf}\n',
          )

          regression_test = dedent('''
          import unittest
          from pathlib import Path

          from backend.proxy import _is_max_unsupported_error


          ROOT = Path(__file__).resolve().parents[1]


          class MaxUnsupportedErrorTests(unittest.TestCase):
              def test_detects_rejected_thinking_or_effort_fields(self):
                  self.assertTrue(
                      _is_max_unsupported_error(
                          400,
                          '{"error":{"message":"output_config.effort=max is not supported"}}',
                      )
                  )
                  self.assertTrue(_is_max_unsupported_error(422, "Invalid parameter: thinking"))
                  self.assertTrue(
                      _is_max_unsupported_error(400, "reasoning_effort has an invalid value: max")
                  )

              def test_preserves_unrelated_upstream_errors(self):
                  self.assertFalse(_is_max_unsupported_error(400, "invalid parameter: temperature"))
                  self.assertFalse(_is_max_unsupported_error(400, "maximum context length exceeded"))
                  self.assertFalse(_is_max_unsupported_error(400, "model is not supported"))
                  self.assertFalse(_is_max_unsupported_error(401, "thinking is not supported"))


          class FrontendPresetFormatTests(unittest.TestCase):
              def test_lowercase_openai_preset_is_passed_to_the_normalizer(self):
                  source = (ROOT / "frontend/js/app.js").read_text(encoding="utf-8")
                  self.assertIn("setFormApiFormat(preset.apiFormat);", source)
                  self.assertNotIn('preset.apiFormat === "OpenAI"', source)


          class InstallerCleanupTests(unittest.TestCase):
              def test_upgrade_keeps_policy_and_real_uninstall_clears_only_ccds_values(self):
                  source = (ROOT / "installer.nsi").read_text(encoding="utf-8")
                  self.assertIn("ExecWait '\"$R0\" /S /UPGRADE'", source)
                  self.assertIn('${GetOptions} "$R0" "/UPGRADE" $R1', source)
                  self.assertIn('ReadRegStr $0 HKCU "${CLAUDE_POLICY_KEY}" "ccds_managed"', source)
                  self.assertIn('StrCmp $0 "true" 0 done_clear_policy', source)
                  self.assertIn('${If} $UninstallIsUpgrade != "1"', source)
                  for value_name in (
                      "inferenceProvider",
                      "inferenceGatewayBaseUrl",
                      "inferenceGatewayApiKey",
                      "inferenceGatewayAuthScheme",
                      "inferenceGatewayHeaders",
                      "inferenceModels",
                      "isClaudeCodeForDesktopEnabled",
                      "coworkEgressAllowedHosts",
                      "ccds_managed",
                  ):
                      self.assertIn(
                          f'DeleteRegValue HKCU "${{CLAUDE_POLICY_KEY}}" "{value_name}"',
                          source,
                      )


          if __name__ == "__main__":
              unittest.main()
          ''').lstrip()
          (ROOT / "tests/test_maintenance_regressions.py").write_text(
              regression_test,
              encoding="utf-8",
          )

          test_workflow = dedent('''
          name: Tests

          on:
            push:
              branches:
                - main
            pull_request:

          permissions:
            contents: read

          concurrency:
            group: tests-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            unit:
              name: Python and frontend (${{ matrix.os }})
              runs-on: ${{ matrix.os }}
              timeout-minutes: 30
              strategy:
                fail-fast: false
                matrix:
                  os:
                    - ubuntu-latest
                    - windows-latest
                    - macos-14
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.11'
                    cache: pip
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - name: Install Python dependencies
                  run: python -m pip install -r requirements.txt
                - name: Compile Python sources
                  run: python -m compileall -q backend main.py tests
                - name: Run unit tests
                  run: python -m unittest discover -s tests -v
                - name: Check frontend JavaScript syntax
                  run: |
                    node --check frontend/js/api.js
                    node --check frontend/js/app.js
                    node --check frontend/js/i18n.js

            installer-syntax:
              name: NSIS installer syntax
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v4
                - name: Install NSIS
                  run: |
                    sudo apt-get update
                    sudo apt-get install -y nsis
                - name: Compile installer with a dummy payload
                  run: |
                    mkdir -p dist/CC-Desktop-Switch
                    printf 'syntax-check' > dist/CC-Desktop-Switch/placeholder.txt
                    makensis -V2 installer.nsi
          ''').lstrip()
          (ROOT / ".github/workflows/test.yml").write_text(test_workflow, encoding="utf-8")

          readme = ROOT / "README.md"
          replace_once(
              readme,
              "### Claude Code attribution header\n",
              dedent('''
              ### Claude Desktop shows "Managed by your organization" after uninstall

              CC Desktop Switch uses Claude Desktop's policy location for third-party inference settings. A normal Windows uninstall now removes only policy values carrying the `ccds_managed=true` marker. Silent in-place upgrades pass `/UPGRADE` and keep the active provider configuration. Policies written under HKLM, delivered by MDM, or owned by another administrator are never removed.

              With v1.0.25 or earlier, use **Clear Desktop configuration** before uninstalling. If Claude Desktop is still managed afterwards, check for machine- or organization-level policy rather than deleting unrelated registry values.

              ### DeepSeek Max / reasoning errors

              DeepSeek's official Anthropic-compatible endpoint supports `output_config.effort=max`. CC Desktop Switch now shows the Max compatibility hint only when a 400/422 response explicitly names a thinking/effort field and rejects it. Unrelated authentication, URL, model, context-length, or parameter errors remain visible for diagnosis.

              ### Claude Code attribution header
              ''').lstrip(),
          )
          replace_once(
              readme,
              "GitHub Copilot subscriptions are not directly supported as a provider API in CC Desktop Switch. If you bring your own OpenAI Chat or Anthropic-compatible endpoint that proxies Copilot or another service, you can try it as a custom third-party provider at your own risk. Verify the endpoint's terms, account risk, API format, base URL, streaming behavior, and tool-call compatibility before relying on it.\n",
              "GitHub Copilot subscriptions are not directly supported as a provider API in CC Desktop Switch. Supported Copilot clients now offer their own BYOK/custom-provider settings, including OpenAI-compatible and local endpoints; configure those inside Copilot rather than routing a subscription through CC Desktop Switch. If you bring an independent OpenAI Chat or Anthropic-compatible endpoint, you can still test it as a custom provider after verifying its terms, API format, streaming behavior, and tool-call compatibility.\n",
          )

          readme_zh = ROOT / "README.zh-CN.md"
          replace_once(
              readme_zh,
              "### Claude Code attribution header\n",
              dedent('''
              ### 卸载后 Claude Desktop 仍显示“由组织管理”

              CC Desktop Switch 使用 Claude Desktop 的策略位置写入第三方推理配置。现在 Windows 正常卸载时，只会删除带有 `ccds_managed=true` 标记、由 CCDS 自己写入的策略值；静默覆盖升级会传入 `/UPGRADE` 并保留当前 provider 配置。HKLM、MDM 或其他管理员写入的组织策略不会被删除。

              v1.0.25 及更早版本建议先在应用中执行“清除桌面版配置”再卸载。若之后仍显示由组织管理，应检查机器级或组织级策略，不要直接删除无关注册表项。

              ### DeepSeek Max / 推理参数报错

              DeepSeek 官方 Anthropic 兼容端点支持 `output_config.effort=max`。CC Desktop Switch 现在只有在上游 400/422 明确指出 thinking/effort 字段并拒绝它时，才显示 Max 兼容提示；鉴权、URL、模型、上下文长度或其他参数错误会保留原始诊断信息。

              ### Claude Code attribution header
              ''').lstrip(),
          )
          replace_once(
              readme_zh,
              "CC Desktop Switch 不直接支持把 GitHub Copilot 订阅账号当作 provider API 使用。如果你自己提供了 OpenAI Chat 或 Anthropic 兼容的 Copilot 中转端点，可以按自定义第三方 provider 尝试接入，但风险由用户自行承担。请先确认端点使用规则、账号风险、API 格式、Base URL、流式输出和工具调用是否真的兼容。\n",
              "CC Desktop Switch 不直接支持把 GitHub Copilot 订阅账号当作 provider API 使用。当前部分 Copilot 客户端已经提供自己的 BYOK / 自定义 provider 设置，可直接配置 OpenAI 兼容或本地端点；这类能力应在 Copilot 内部配置，而不是把订阅账号绕到 CC Desktop Switch。你仍可把独立的 OpenAI Chat 或 Anthropic 兼容端点作为自定义 provider 测试，但应先确认使用规则、API 格式、流式输出和工具调用兼容性。\n",
          )

          one_shot = ROOT / ".github/workflows/maintenance-patch.yml"
          one_shot.unlink()
          PY

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and test Python
        run: |
          python -m compileall -q backend main.py tests
          python -m unittest discover -s tests -v

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/js/api.js
          node --check frontend/js/app.js
          node --check frontend/js/i18n.js

      - name: Validate NSIS installer syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          mkdir -p dist/CC-Desktop-Switch
          printf 'syntax-check' > dist/CC-Desktop-Switch/placeholder.txt
          makensis -V2 installer.nsi
          rm -rf dist CC-Desktop-Switch-Setup-1.0.25.exe

      - name: Commit reviewed changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden stable maintenance paths [maintenance-patch]"
          git push origin HEAD:codex/stable-maintenance-20260818
